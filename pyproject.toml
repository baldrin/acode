[project]
name = "acode"
version = "0.1.0"
description = "A minimal agentic coding harness for Claude models"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.116"]

[project.scripts]
acode = "acode.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
